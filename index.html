<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIBRARY WEB</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2 class="containerHeader">CRIFTORE LIBRARY</h2>
      <div class="cardContainer">
        <div class="cardContent"></div>
        <div class="cardShadaw"></div>
      </div>
      <div class="containerFooter">
        <button class="addButton" command="show-modal" commandfor="myDialog">
          New Book
        </button>
      </div>

      <dialog id="myDialog">
        <div class="dialogHeader"><h3>Add New Book</h3></div>
        <form id="containerForm">
          <div class="formRow">
            <label for="formTitle">Title :</label>
            <input type="text" id="formTitle" />
          </div>
          <div class="formRow">
            <label for="formAuthor">Author :</label>
            <input type="text" id="formAuthor" />
          </div>
          <div class="formRow">
            <label for="formPages">Pages :</label>
            <input type="number" id="formPages" />
          </div>
          <div class="formRowCover">
            <label for="formCover">Cover</label>
            <input type="file" id="formCover" accept="image/*" />
          </div>

          <div class="formRowStatus">
            <label for="formStatus">Already read it? </label>
            <select id="formStatus">
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>
          <div class="buttonForm">
            <button type="submit">Add Book</button>
            <button type="button" id="closeDialog" formmethod="dialog">
              Cancel
            </button>
          </div>
        </form>
      </dialog>
    </div>

    <script src="script.js"></script>
  </body>
</html>
